<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0614;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:#fff8e1;user-select:none;-webkit-user-select:none}
body.ml{font-family:'Noto Sans Malayalam',sans-serif}
body.ta{font-family:'Noto Sans Tamil',sans-serif}
#wrap{position:relative;height:100vh;height:100dvh;aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#000;touch-action:manipulation}
@supports not (aspect-ratio:9/16){#wrap{width:56.25vh}}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.pix{font-family:'Press Start 2P',monospace}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:8px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hudL{font-weight:700;font-size:14px;text-shadow:2px 2px 0 #000}
#hearts{color:#ff4d6d;font-size:16px;letter-spacing:1px;text-shadow:2px 2px 0 #000}
.hbtns{display:flex;gap:6px}
.sbtn{background:#2a1540;border:2px solid #f2c14e;color:#f2c14e;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700;box-shadow:2px 2px 0 #000}

#dialog{position:absolute;left:3%;right:3%;bottom:3%;min-height:20%;background:#1a0f2e;border:4px solid #f2c14e;outline:3px solid #000;box-shadow:0 0 0 6px #7b1e1e;border-radius:4px;padding:12px 14px 22px;z-index:6;font-size:17px;line-height:1.55}
#dname{color:#f2c14e;font-weight:900;font-size:15px;margin-bottom:2px}
#dnext{position:absolute;right:10px;bottom:4px;color:#f2c14e;font-size:12px;animation:blink 0.8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

#toast{position:absolute;top:13%;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:#000c;border:3px solid #f2c14e;padding:6px 14px;font-weight:900;font-size:18px;white-space:normal;z-index:6;border-radius:4px;transition:opacity .25s}
#hint{position:absolute;left:4%;right:4%;bottom:4%;text-align:center;font-weight:700;font-size:15px;background:#000a;padding:6px 8px;border-radius:4px;z-index:5;text-shadow:1px 1px 0 #000}

.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#title{justify-content:flex-end;padding:0 6% 9%;text-align:center;background:linear-gradient(to bottom,transparent 35%,#0b0614cc 62%,#0b0614 100%)}
#tTitle{width:100%;white-space:nowrap;overflow:hidden;font-size:44px;font-weight:900;color:#f2c14e;text-shadow:3px 3px 0 #7b1e1e,6px 6px 0 #000;line-height:1.2}
#tTag{font-size:16px;font-weight:700;margin:4px 0 10px;color:#ffd9a0}
#tEd{font-size:14px;line-height:1.5;color:#fff}
#tDates{font-size:10px;margin:8px 0 14px;color:#f2c14e}
.langrow{display:flex;gap:10px;margin-bottom:14px}
.lbtn{min-width:110px;padding:10px 12px;border:3px solid #f2c14e;background:#2a1540;color:#fff8e1;border-radius:6px;font-size:18px;font-weight:700;box-shadow:3px 3px 0 #000}
.lbtn.on{background:#f2c14e;color:#2a1540}
#langScr{justify-content:flex-end;padding:0 8% 18%;background:linear-gradient(to bottom,transparent 40%,#0b0614dd 65%,#0b0614 100%)}
.lsHead{font-size:17px;font-weight:700;color:#ffd9a0;text-align:center;line-height:1.5}
.lsHead.ml{font-family:'Noto Sans Malayalam',sans-serif}.lsHead.ta{font-family:'Noto Sans Tamil',sans-serif;margin-bottom:18px}
.lsBtns{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
.lsBtns .lbtn{width:80%;padding:14px;font-size:24px}
.lbtn.ml{font-family:'Noto Sans Malayalam',sans-serif}.lbtn.ta{font-family:'Noto Sans Tamil',sans-serif}
.big{white-space:nowrap;max-width:100%;overflow:hidden;padding:12px 22px;font-size:20px;font-weight:900;background:#c0392b;color:#fff;border:3px solid #fff3c4;border-radius:8px;box-shadow:0 5px 0 #7b1e1e,0 5px 0 3px #000;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

#promo{overflow-x:hidden;background:radial-gradient(circle at 50% 0,#3b1a4a,#0b0614 70%);padding:18px 5% 26px;text-align:center}
#promo img{width:100%;border:4px solid #f2c14e;outline:3px solid #000;border-radius:4px;margin:8px 0 12px;image-rendering:auto}
#pChant{font-size:18px;font-weight:900;color:#f2c14e;text-shadow:2px 2px 0 #7b1e1e}
#pHead{width:100%;font-size:24px;overflow-wrap:anywhere;font-weight:900;margin-top:6px;line-height:1.3}
.pline{font-size:15px;line-height:1.55;margin-top:6px}
.when{background:#c0392b;border:3px solid #fff3c4;border-radius:6px;padding:8px;font-weight:900;font-size:17px;margin:10px 0 4px;box-shadow:3px 3px 0 #000}
.card{background:#1a0f2e;border:3px solid #f2c14e;border-radius:6px;padding:12px;margin-top:16px;text-align:left;box-shadow:3px 3px 0 #000}
.card h3{font-size:18px;color:#f2c14e;margin-bottom:4px;text-align:center}
.card .note{font-size:13px;text-align:center;opacity:.85;margin-bottom:10px}
.eng{font-family:system-ui,sans-serif;font-size:13px;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;background:#0b0614;border-radius:4px;padding:6px 8px}
.row .lbl{font-size:12px;opacity:.8}
.row .val{font-family:'Press Start 2P',monospace;font-size:11px;word-break:break-all;color:#fff3c4;margin-top:3px}
.cbtn{flex-shrink:0;background:#f2c14e;color:#2a1540;border:2px solid #000;border-radius:4px;padding:6px 8px;font-weight:900;font-size:13px}
.phones a{color:#fff3c4;font-family:'Press Start 2P',monospace;font-size:11px;display:inline-block;margin:6px 6px 0;text-decoration:none;border-bottom:2px dotted #f2c14e}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:20px;align-items:center}
.wa{display:inline-block;background:#25d366;color:#05310f;font-weight:900;font-size:17px;padding:11px 20px;border-radius:8px;border:3px solid #000;text-decoration:none;box-shadow:3px 3px 0 #000}
.again{background:#2a1540;color:#f2c14e;border:3px solid #f2c14e;border-radius:8px;padding:10px 20px;font-weight:900;font-size:16px;box-shadow:3px 3px 0 #000}
.foot{font-size:11px;opacity:.6;margin-top:18px}
</style>

let AC=null, muted=false;
function beep(f,d,type='square',v=0.05,slide=0){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(f,n);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);
    g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g).connect(AC.destination); o.start(n); o.stop(n+d+0.02);
  }catch(e){}
}

    const s={x:22+Math.random()*136,y:70+Math.random()*180,type:Math.random()<.5?'rock':'bush',checked:false};
    if(Math.hypot(s.x-90,s.y-285)<40)continue;
    if(out.every(o=>Math.hypot(o.x-s.x,o.y-s.y)>34))out.push(s);}
  return out;
}
async function startLevel(i){
  level=i;hearts=5;spots=genSpots(LV[i].n);sooraSpot=Math.random()*spots.length|0;
  moveTimer=LV[i].move;vb={x:90,y:285,tx:90,ty:285,flip:false,moving:false};fight=null;
  state='level';hint(null);$('hud').classList.remove('hidden');updateHud();
  toast(t('n'+i),1400);
}
function relocate(){
  const cand=spots.map((s,i)=>i).filter(i=>i!==sooraSpot&&!spots[i].checked&&Math.hypot(spots[i].x-vb.x,spots[i].y-vb.y)>40);
  if(!cand.length)return;
  const old=spots[sooraSpot];burst(old.x,old.y,8,['#c99e5c','#fff']);
  sooraSpot=cand[Math.random()*cand.length|0];
}
function checkSpot(i){
  const s=spots[i];
  if(i===sooraSpot){
    state='reveal';revealT=0;sfx.found();toast(t('found')+' '+t('n'+level),1300);burst(s.x,s.y,14,['#f2c14e','#fff','#c0392b']);
    setTimeout(beginFight,800);
  }else{
    s.checked=true;sfx.empty();burst(s.x,s.y,6,['#c99e5c','#e6c487']);toast(t('empty'),800);
  }
}
function beginFight(){
  const c=LV[level];fight={hp:3,pos:0,dir:1,zc:.3+Math.random()*.4,zw:c.zone,speed:c.speed,cool:0,hitT:0,bob:0};
  state='fight';hint('fightHint');updateHud();
}
async function fightTap(){
  const f=fight;if(f.cool>0)return;f.cool=.35;
  if(Math.abs(f.pos-f.zc)<f.zw/2){
    f.hp--;f.hitT=.25;sfx.hit();burst(90,130,16,['#fff','#f2c14e','#c0392b'],60);toast(t('good'),600);
    f.zc=.2+Math.random()*.6;
    if(f.hp<=0){
      state='busy';hint(null);sfx.win();toast(t('fell').replace('{n}',t('n'+level)),1600);burst(90,130,40,['#fff','#f2c14e','#ff4d6d','#48c9b0'],90,1);
      await wait(1600);
      if(level<2){await say(level===0?'lvl2tip':'lvl3tip');startLevel(level+1);}else{runChase();}
    }
  }else{
    hearts--;shakeT=.3;sfx.miss();toast(t('miss'),600);updateHud();
    if(hearts<=0){state='busy';hint(null);await say('gameover');startLevel(level);}
  }
}

/* ================= CUTSCENES ================= */
function obj(sp,x,y,s=1,extra={}){return Object.assign({sp,x,y,s,flip:false,alpha:1,vis:true},extra);}
async function runStory(){
  state='scene';$('hud').classList.remove('hidden');updateHud();
  scene={skyH:70,seaEnd:130,tree:null,flag:false,objs:[
    obj(S.sura,90,100,2,{alpha:.9}),
    obj(S.mu,90,215,3,{glow:true}),
    obj(S.vb,40,280,2),obj(S.vb,140,280,2,{flip:true}),obj(S.vb,90,295,2)
  ]};
  scene.objs[1].vis=false;
  await say('intro1');
  scene.objs[1].vis=true;sfx.magic();flashT=.4;
  await say('intro2');
  await say('intro3','vb');
  await say('howto');
  await say('lvl1tip');
  startLevel(0);
}
async function runChase(){
  state='scene';updateHud();hint(null);
  const sura=obj(S.sura,90,215,2),vbo=obj(S.vb,90,295,2),mu=obj(S.mu,90,340,3,{glow:true,vis:false});
  scene={skyH:0,seaEnd:130,tree:null,flag:false,objs:[sura,vbo,mu]};
  await say('chase1');
  sfx.blip();
  await Promise.all([tween(sura,{y:95},1300),tween(vbo,{y:200},1500)]);
  flashT=.6;sfx.magic();sura.vis=false;scene.tree={x:90,y:85,sep:0,shake:0};burst(90,80,30,['#27ae60','#f4d03f','#fff'],70,1);
  await wait(500);
  await say('chase2');
  await tween(vbo,{y:150},500);sfx.hit();scene.tree.shake=.4;shakeT=.25;burst(90,110,10,['#fff','#7fc8f8']);
  await wait(400);
  await say('chase3','vb');
  mu.vis=true;sfx.fanfare();
  await Promise.all([tween(mu,{y:250},1100,easeOut),tween(vbo,{x:35,y:250},900)]);
  await say('chase4','mu');
  startFinale(mu,vbo);
}
let fin=null;
function startFinale(mu,vbo){
  fin={mu,vbo,tx:90,phase:0,speed:1.5,vel:null,misses:0};
  state='finale';hint('finaleHint');updateHud();
}
function finaleTap(){
  if(fin.vel)return;
  fin.vel={x:fin.mu.x,y:fin.mu.y-20};sfx.vel();
}
async function runSplit(){
  state='scene';hint(null);sfx.boom();flashT=.7;shakeT=.4;
  const tr=scene.tree;burst(tr.x,tr.y-10,50,['#fff','#f2c14e','#27ae60','#f4d03f'],100,1.2);
  await tween(tr,{sep:16},700,easeOut);
  await say('split1');
  sfx.magic();flashT=.5;
  const pea=obj(S.pea,tr.x-16,tr.y-10,2),roo=obj(S.roo,tr.x+16,tr.y-10,2,{flip:true});
  scene.objs.push(pea,roo);scene.tree=null;
  burst(pea.x,pea.y,20,['#48c9b0','#2e86de','#fff']);burst(roo.x,roo.y,20,['#fff','#c0392b']);
  await wait(500);
  await tween(pea,{x:fin.mu.x+30,y:fin.mu.y+8},1100,easeOut);
  await say('split2');
  scene.flag=true;
  await tween(roo,{x:150,y:150,s:1.5},1100,easeOut);
  await say('split3');
  sfx.fanfare();celebrate=true;
  await say('chant','mu');
  celebrate=false;showPromo();
}
let celebrate=false,fwT=0;

function showPromo(){
  state='promo';hint(null);$('hud').classList.add('hidden');
  $('vAcc').textContent=BANK.acc;$('vIfsc').textContent=BANK.ifsc;
  $('phones').innerHTML=PHONES.map(p=>`<a href="tel:+91${p}">${p}</a>`).join('');
  updateShare();$('promo').classList.remove('hidden');$('promo').scrollTop=0;
}

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  tweens=tweens.filter(f=>!f(now));
  ctx.save();
  if(shakeT>0){shakeT-=dt;ctx.translate((Math.random()-.5)*4|0,(Math.random()-.5)*4|0);}
  if(state==='title')drawTitle();
  else if(state==='level'||state==='reveal'||state==='busy'&&!fight)drawLevel(dt);
  else if(state==='fight'||state==='busy'&&fight)drawFight(dt);
  else if(state==='scene')drawScene(dt);
  else if(state==='finale')drawFinale(dt);
  else if(state==='promo')drawScene(dt);
  drawParts(dt);
  if(celebrate){fwT-=dt;if(fwT<=0){fwT=.35;burst(20+Math.random()*140,20+Math.random()*90,24,['#f2c14e','#ff4d6d','#48c9b0','#fff','#8e44ad'],50,1);beep(300+Math.random()*500,.08,'triangle',.02);}}
  ctx.restore();
  if(flashT>0){flashT-=dt;ctx.fillStyle=`rgba(255,250,220,${Math.min(1,flashT*1.6)})`;ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(loop);
}
function drawTitle(){
  drawBg(110,170,time);
  ctx.fillStyle='rgba(255,209,102,.25)';ctx.beginPath();ctx.arc(90,95,34+Math.sin(time*2)*3,0,7);ctx.fill();
  spr(S.mu,90,95+Math.sin(time*2)*2,4);
  spr(S.pea,40,140,2);spr(S.roo,142,140,2,true);
}
function drawLevel(dt){
  drawBg(0,40,time);
  const c=LV[level];
  if(state==='level'&&c.move>0){moveTimer-=dt;if(moveTimer<=0){moveTimer=c.move;relocate();}}
  // vb movement
  if(state==='level'){
    const dx=vb.tx-vb.x,dy=vb.ty-vb.y,d=Math.hypot(dx,dy);
    vb.moving=d>1.5;if(vb.moving){const sp=Math.min(d,70*dt);vb.x+=dx/d*sp;vb.y+=dy/d*sp;if(Math.abs(dx)>1)vb.flip=dx<0;}
    for(let i=0;i<spots.length;i++){const s=spots[i];if(!s.checked&&Math.hypot(s.x-vb.x,s.y-vb.y)<15){checkSpot(i);break;}}
  }
  // tap marker
  if(state==='level'&&vb.moving){ctx.strokeStyle='#fff';ctx.globalAlpha=.6;ctx.strokeRect(vb.tx-3,vb.ty-1,6,3);ctx.globalAlpha=1;}
  // draw spots & vb sorted by y
  const items=spots.map((s,i)=>({y:s.y,draw:()=>{
    let ox=0;const isS=i===sooraSpot&&state==='level';
    if(isS&&(time%2.6)<.35)ox=Math.sin(time*70)*1.5;
    if(i===sooraSpot&&state!=='level'){spr(c.sp,s.x,s.y-10-Math.min(1,revealT*3)*8,1.5);}
    spr(s.type==='rock'?S.rock:S.bush,s.x+ox,s.y,1.4,false,s.checked?.4:1);
  }}));
  items.push({y:vb.y+4,draw:()=>{const bob=vb.moving?Math.abs(Math.sin(time*14))*-1.5:0;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(vb.x-6|0,vb.y+11|0,12,3);spr(S.vb,vb.x,vb.y+bob,1.5,vb.flip);}});
  if(state==='reveal')revealT+=dt;
  items.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
}
function drawFight(dt){
  drawBg(0,40,time);ctx.fillStyle='rgba(20,5,30,.72)';ctx.fillRect(0,0,W,H);
  const f=fight,c=LV[level];
  if(state==='fight'){f.pos+=f.dir*f.speed*dt;if(f.pos>1){f.pos=1;f.dir=-1;}if(f.pos<0){f.pos=0;f.dir=1;}f.cool=Math.max(0,f.cool-dt);}
  f.hitT=Math.max(0,f.hitT-dt);
  const alive=f.hp>0;
  ctx.fillStyle='rgba(192,57,43,.35)';ctx.beginPath();ctx.arc(90,130,40,0,7);ctx.fill();
  if(alive||Math.floor(time*20)%2)spr(c.sp,90+(f.hitT>0?(Math.random()-.5)*6:0),130+Math.sin(time*3)*3,4,false,alive?1:Math.max(0,.6));
  if(f.hitT>0){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(0,0,W,H);}
  spr(S.vb,45,225,3);
  for(let i=0;i<3;i++){ctx.fillStyle=i<f.hp?'#ff4d6d':'#3b1a4a';ctx.fillRect(72+i*13,82,10,6);ctx.strokeStyle='#000';ctx.strokeRect(72+i*13,82,10,6);}
  // bar
  const bx=15,by=258,bw=150,bh=14;
  ctx.fillStyle='#000';ctx.fillRect(bx-2,by-2,bw+4,bh+4);ctx.fillStyle='#3b1a4a';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#f2c14e';ctx.fillRect(bx+(f.zc-f.zw/2)*bw|0,by,f.zw*bw|0,bh);
  ctx.fillStyle='#fff';const mx=bx+f.pos*bw|0;ctx.fillRect(mx-2,by-4,4,bh+8);
  ctx.fillStyle='#c0392b';ctx.fillRect(mx-1,by-3,2,bh+6);
}
function drawScene(dt){
  drawBg(scene.skyH,scene.seaEnd,time);
  if(scene.tree){const tr=scene.tree;tr.shake=Math.max(0,(tr.shake||0)-dt);drawTree(tr.x+(tr.shake>0?Math.sin(time*60)*2:0),tr.y,tr.sep);}
  if(scene.flag){ctx.fillStyle='#6e3b1f';ctx.fillRect(149,150,2,110);ctx.fillStyle='#c0392b';ctx.fillRect(151,152,24,16);ctx.fillStyle='#f2c14e';ctx.fillRect(151,152,24,2);}
  scene.objs.forEach(o=>{if(!o.vis)return;
    if(o.glow){ctx.fillStyle='rgba(255,209,102,.3)';ctx.beginPath();ctx.arc(o.x,o.y,o.s*10+Math.sin(time*3)*2,0,7);ctx.fill();}
    spr(o.sp,o.x,o.y+(o.glow?Math.sin(time*2)*1.5:0),o.s,o.flip,o.alpha);});
}
function drawFinale(dt){
  drawBg(0,130,time);
  const tr=scene.tree;
  fin.phase+=dt*fin.speed;tr.x=90+Math.sin(fin.phase)*55;
  drawTree(tr.x,tr.y);
  // aim guide
  ctx.fillStyle='rgba(255,255,255,.18)';for(let y=110;y<225;y+=8)ctx.fillRect(89,y,2,4);
  spr(fin.vbo.sp,fin.vbo.x,fin.vbo.y,2);
  const mu=fin.mu;ctx.fillStyle='rgba(255,209,102,.3)';ctx.beginPath();ctx.arc(mu.x,mu.y,32+Math.sin(time*3)*2,0,7);ctx.fill();
  spr(S.mu,mu.x,mu.y,3);
  if(fin.vel){
    const v=fin.vel;v.y-=230*dt;spr(S.vel,v.x,v.y,2);
    if(Math.random()<.8)parts.push({x:v.x+(Math.random()-.5)*4,y:v.y+14,vx:0,vy:10,l:.3,c:'#f2c14e'});
    if(!v.done&&v.y<=tr.y-8){
      v.done=true;
      if(Math.abs(tr.x-v.x)<15){fin.vel=null;scene.tree={x:tr.x,y:tr.y,sep:0};runSplit();return;}
      else{fin.misses++;toast(t('again1'),900);sfx.miss();fin.speed=Math.max(.9,fin.speed-.15);}
    }
    if(v.y<-30)fin.vel=null;
  }
}

/* ================= INPUT ================= */
$('wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('button,a'))return;
  if(state==='title'||state==='promo')return;
  if(dlgResolve){dlgTap();return;}
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(state==='level'){vb.tx=Math.max(10,Math.min(170,x));vb.ty=Math.max(55,Math.min(300,y));}
  else if(state==='fight')fightTap();
  else if(state==='finale')finaleTap();
});
document.querySelectorAll('.lbtn').forEach(b=>b.addEventListener('click',()=>{setLang(b.dataset.lang);beep(523,.08);$('langScr').classList.add('hidden');$('title').classList.remove('hidden');fitAll();}));
$('hLang').addEventListener('click',()=>setLang(lang==='ml'?'ta':'ml'));
$('hMute').addEventListener('click',()=>{muted=!muted;$('hMute').textContent=muted?'×':'♪';});
$('play').addEventListener('click',()=>{beep(523,.1);$('title').classList.add('hidden');runStory();});
$('again').addEventListener('click',()=>{$('promo').classList.add('hidden');parts=[];startLevel(0);});
document.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',async()=>{
  const v=$(b.dataset.copy).textContent;let ok=false;
  try{await navigator.clipboard.writeText(v);ok=true;}catch(e){
    try{const r=document.createRange();r.selectNodeContents($(b.dataset.copy));const s=getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand('copy');}catch(e2){}}
  b.textContent=ok?t('copied'):'✓';setTimeout(()=>b.textContent=t('copy'),1500);
}));

applyLang();
window.addEventListener('resize',fitAll);
try{document.fonts.ready.then(fitAll);}catch(e){}
requestAnimationFrame(loop);
</script>
